<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SendGuard</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="shared.js"></script>
  <script src="taskpane.js"></script>
  <style>
    :root { --bg: #ffffff; --fg: #242424; --muted: #616161; --line: #d1d1d1; --accent: #0f6cbd; --accent-fg: #ffffff; --warn: #bc4b09; --ok: #107c10; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #292929; --fg: #ffffff; --muted: #adadad; --line: #525252; --accent: #479ef5; --accent-fg: #000000; --warn: #f7a76b; --ok: #54b054; }
    }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
    section { margin-bottom: 18px; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 2px 0; word-break: break-all; }
    .warn { color: var(--warn); }
    .muted { color: var(--muted); }
    input { box-sizing: border-box; width: 100%; padding: 6px 8px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { margin-top: 10px; padding: 6px 16px; font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--warn); }
  </style>
</head>
<body>
  <section id="recipients"><span class="muted">Lecture des destinataires…</span></section>
  <section>
    <h2><label for="subject">Objet</label></h2>
    <input id="subject" type="text" autocomplete="off">
    <button id="validate" disabled>Valider</button>
    <div id="status" class="muted"></div>
  </section>
</body>
</html>
